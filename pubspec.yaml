name: holspend
description: "HolSpend - Daily Wallet expense companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.3

  # Google Login (pinned to 6.x: the 7.x API is a breaking rewrite)
  google_sign_in: '>=6.2.0 <7.0.0'

  # State management
  flutter_riverpod: ^2.5.1

  # Formatting
  # Pinned by flutter_localizations from the Flutter SDK.
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
