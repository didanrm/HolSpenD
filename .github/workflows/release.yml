name: Release

# Fires on semantic version tags, with or without the leading v:
#   git tag 1.0.0   /   git tag v1.0.0
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# Needed to create the release and upload the APK to it.
permissions:
  contents: write

jobs:
  # A tag must never ship code that fails the wallet tests.
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Stub Firebase config
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release:
    name: Build & publish APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # The tag is the single source of truth for the version number, so a
      # release can never disagree with what it is labelled.
      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (build ${{ github.run_number }})"

      - name: Restore Firebase config
        env:
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_OPTIONS" ] || [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::FIREBASE_OPTIONS / GOOGLE_SERVICES_JSON secrets are not set."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      # Signing decides whether Google Sign-In works in the published APK: the
      # signing certificate's SHA-1 must be registered in Firebase. With a
      # RELEASE_KEYSTORE secret the APK is properly release-signed; without one
      # it falls back to the debug key, which is fine for sideloading as long as
      # that key's SHA-1 is the one registered.
      - name: Set up signing
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 --decode > android/holspend-release.jks
            cat > android/key.properties <<EOF
          storeFile=holspend-release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF
            echo "signing=release" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
            echo "signing=debug (no RELEASE_KEYSTORE secret)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No RELEASE_KEYSTORE and no DEBUG_KEYSTORE. The APK would be signed with a throwaway key and Google Sign-In would fail with ApiException: 10."
            exit 1
          fi

      - run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "holspend-${{ steps.version.outputs.version }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "HolSpend ${{ steps.version.outputs.version }}" \
            --generate-notes \
            "holspend-${{ steps.version.outputs.version }}.apk"

      # Keep the signing material out of the runner's reach for anything that
      # might run afterwards.
      - name: Scrub secrets
        if: always()
        run: rm -f android/holspend-release.jks android/key.properties ~/.android/debug.keystore
