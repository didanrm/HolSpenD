name: Build APK

on:
  push:
    # Feature branches build too: the APK artifact is how changes get tested on
    # a real phone without a local Android toolchain.
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Analyzer + wallet tests. Pure Dart, so this needs no Firebase config at all
  # and gives fast feedback on forks and pull requests.
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # firebase_options.dart is gitignored; the placeholder keeps `flutter
      # analyze` compiling on forks that have no access to the secrets.
      - name: Stub Firebase config
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    # Skip on forks: they cannot read the secrets, so the build would fail with
    # a confusing google-services error instead of an obvious one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Restore Firebase config
        env:
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_OPTIONS" ] || [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::FIREBASE_OPTIONS / GOOGLE_SERVICES_JSON secrets are not set."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      # Without this the runner generates a fresh debug keystore whose SHA-1 is
      # not registered in Firebase, and Google Sign-In fails at runtime with
      # ApiException: 10 in an APK that otherwise looks fine.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::error::DEBUG_KEYSTORE secret is not set - Google Sign-In would fail in the built APK."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HolSpenD-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
